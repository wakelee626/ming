<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大明余烬</title><style>*{box-sizing:border-box}body{margin:0;background:#19221e;color:#dcd4bd;font-family:Georgia,SimSun,serif}main{max-width:1050px;margin:auto;padding:35px 24px}header{letter-spacing:5px;border-bottom:1px solid #65705a;padding-bottom:20px}h1{font-size:48px;font-weight:400;letter-spacing:10px}small,footer{color:#a4aa97}#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0}.stat{padding:20px;background:#263128}.stat b{display:block;font-size:30px;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 240px;gap:30px}article{padding:32px;background:#e5dcc5;color:#343e32;min-height:430px}h2{font-size:30px;font-weight:400}p{line-height:1.9}button{font:inherit;cursor:pointer;padding:16px;border:1px solid #aaa48b;background:#f0eadb;color:#344235;text-align:left}button:hover{background:#d4d5bc}button:focus-visible{outline:3px solid #b65f40}#choices{display:grid;gap:12px}button small{display:block;color:#78745f;margin-top:8px}aside p{font-size:13px}#log{max-height:300px;overflow:auto;font-size:13px;line-height:2}footer{font-size:12px;margin:25px 0}.top{float:right;background:none;color:#dcd4bd;padding:6px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stat{padding:12px}h1{font-size:36px}}</style><main><header>大明余烬 · 帝王决策录 <button class="top" id="reset">重新登基</button></header><h1>一念，山河。</h1><small>内忧未平，边烽又起。十七载国运，尽在朱批之间。</small><div id="stats"></div><div class="grid"><article aria-live="polite"><div id="date"></div><h2 id="title"></h2><p id="story"></p><div id="choices"></div></article><aside><h3>山河纪事</h3><p>每次决策推进一年。任一国势归零则失败，坚持至十七年，按国势进入不同结局。</p><p>每三回合会有一项国势随机下降 5。</p><div id="log"></div></aside></div><footer id="save">架空历史策略原型 · 非历史复原 · 本机自动存档</footer></main><script>
const names=['国库','民心','军备','朝局'];const plots=[['新君临朝','积弊待除，边军缺饷，百官请陛下定下施政之本。'],['陕西大旱','赤地千里，流民渐聚。兵部主剿，户部请赈。'],['辽东急报','前线军饷不足，边城修缮刻不容缓。'],['朝堂党争','诸臣互相攻讦，奏折堆满御案。'],['漕运受阻','河道淤塞，京师米价日高。'],['边军欠饷','军士家眷缺粮，将领上疏求援。'],['乡野烽烟','饥民聚集，各地巡抚催请援兵。'],['海贸之议','海商愿输饷助国，守旧大臣极力反对。'],['灾年加赋','岁入不足，减赋与加派的奏折同时呈上。'],['边城失修','城墙残破，火炮短缺。'],['用人之难','能臣遭到弹劾，证据尚待查明。'],['蝗灾蔓延','灾情越过数府，粮仓逐渐见底。'],['要道烽火','流寇截断官道，前线补给困难。'],['江南税议','士绅隐田，清丈势必触动权贵。'],['京畿疫影','疫病蔓延，百姓请求施药赈粮。'],['南迁之争','群臣议论南迁，守京还是经营退路？'],['最后的朱批','烽烟渐近，十七载国运，系于最后的部署。']];
const policies=[['清查贪墨',13,2,0,-12],['减赋赈济',-12,17,0,3],['整军备战',-12,-2,18,3],['调和朝局',-3,3,-5,13],['商运筹饷',12,3,-2,-7],['招募屯田',-6,9,7,-2]];const sets=[[0,1,2],[1,5,2],[2,4,3],[3,0,5],[4,1,5],[2,0,4],[1,2,5],[4,3,0],[0,1,4],[2,5,4],[3,0,5],[1,5,4],[2,5,3],[0,4,1],[1,5,3],[2,4,3],[1,2,3]];const key='ming-embers-v1';const initial=()=>({t:0,v:[65,60,55,60],log:[]});let s;try{s=JSON.parse(localStorage.getItem(key));if(!s||!Number.isInteger(s.t)||s.t<0||s.t>17||!Array.isArray(s.v)||s.v.length!==4||!s.v.every(x=>Number.isFinite(x)&&x>=0&&x<=100)||!Array.isArray(s.log))s=initial()}catch{s=initial()}
function ending(){let i=s.v.findIndex(x=>x<=0);return i>=0?['府库空虚','民变四起','山河失守','朝纲崩解'][i]:s.t===17?(Math.min(...s.v)>=35?'重整山河':s.v.reduce((a,b)=>a+b,0)>=160?'风雨中兴':'残山待复'):null}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{document.getElementById('save').textContent='无法存档；请保持页面打开。'}}function choose(i){if(ending())return;let c=policies[sets[s.t][i]];s.v=s.v.map((v,j)=>Math.max(0,Math.min(100,v+c[j+1])));let extra='';if((s.t+1)%3===0){let j=Math.floor(Math.random()*4);s.v[j]=Math.max(0,s.v[j]-5);extra=' / 变故：'+names[j]+' −5'}s.log.unshift((1628+s.t)+' · '+c[0]+extra);s.t++;save();render()}
function render(){document.getElementById('stats').innerHTML=s.v.map((v,i)=>`<div class="stat">${names[i]}<b style="color:${v<25?'#dc846c':'#dcd4bd'}">${v}<small style="font-size:12px"> /100</small></b></div>`).join('');let end=ending();document.getElementById('date').textContent=end?'终局 · 执政 '+s.t+' 年':'崇祯 '+(s.t+1)+' 年 · '+(1628+s.t)+' / 待批奏折';document.getElementById('title').textContent=end||plots[s.t][0];document.getElementById('story').textContent=end?'此生已成史册。国运由每一道朱批累积而成。重新登基，尝试另一条道路。':plots[s.t][1];let box=document.getElementById('choices');box.innerHTML='';if(end){let b=document.createElement('button');b.textContent='再执山河 →';b.onclick=restart;box.append(b)}else sets[s.t].forEach((id,i)=>{let c=policies[id],b=document.createElement('button');b.innerHTML=String.fromCharCode(65+i)+' · '+c[0]+'<small>'+c.slice(1).map((v,j)=>v?names[j]+' '+(v>0?'+':'')+v:'').filter(Boolean).join('　')+'</small>';b.onclick=()=>choose(i);box.append(b)});document.getElementById('log').replaceChildren(...s.log.map(x=>{let p=document.createElement('p');p.textContent=x;return p}))}function restart(){s=initial();save();render()}document.getElementById('reset').onclick=()=>{if(confirm('清除本局进度，重新登基？'))restart()};render();
</script></html>
